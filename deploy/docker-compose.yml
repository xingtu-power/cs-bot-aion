# cs-bot-aion · 阿里云 Docker Compose 部署
# 用法: cp .env.example .env && 编辑 .env → docker compose up -d --build
name: cs-bot-aion

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 国内 ECS 建议: PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 1=把 2.3GB 模型打进镜像(云上首次零下载);默认 0=运行时下载
        BAKE_MODEL: ${BAKE_MODEL:-0}
    image: cs-bot-aion:latest
    container_name: csbot
    restart: unless-stopped
    environment:
      # 必填:DeepSeek API Key(缺失则 compose up 直接报错提示)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 deploy/.env 中配置 DEEPSEEK_API_KEY}
      CSAPP_LLM_MODE: ${CSAPP_LLM_MODE:-deepseek}
      # 模型下载源:国内用 hf-mirror(默认);海外 ECS 建议 https://huggingface.co
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 公网访问端口(安全组需放行同端口)
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # 运行态数据(SQLite/会话/debug 日志)— 重建容器不丢
      - data:/app/data
      # 模型缓存(首次下载 2.3GB 后持久化,避免每次重建重新下载)
      - emb_cache:/app/tools/emb_cache
      - hf_cache:/app/tools/hf_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s  # 首次启动含模型下载,勿调小
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  data:
  emb_cache:
  hf_cache:
