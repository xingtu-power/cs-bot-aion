<title>GAC 海外智能客服 · Demo</title>
<style>
:root{--brand:#0b6e5f;--brand2:#0a8f79;--bg:#f4f6f8;--card:#fff;--line:#e3e8ec;--txt:#1c2a33;--mut:#6b7a86;--warn:#c0392b;--side:#0d3b32;--side2:#14524a;--av-size:34px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden}
/* 左侧栏 */
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:#fff;display:flex;flex-direction:column;padding:18px 14px 14px;min-height:0;overflow:hidden}
.side .b-t{font-size:19px;font-weight:800;margin-bottom:2px}
.side .b-s{font-size:12px;color:#a8cbc4;margin-bottom:14px}
.newbtn{margin-bottom:14px;flex-shrink:0}
.side-foot{font-size:11px;color:#8fb3ac;margin-top:auto;line-height:1.5;flex-shrink:0}
/* 历史列表 */
.histlist{flex:1 1 0;min-height:0;overflow-y:auto;padding-right:2px}
.histlist::-webkit-scrollbar{width:6px}.histlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.hg{font-size:12px;font-weight:700;color:#9fc0ba;margin:12px 4px 6px;text-transform:capitalize}
.hist-item{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer;transition:.15s}
.hist-item:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
.hist-item.ended{opacity:.55;cursor:pointer}.hist-item.ended:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.hi-av{width:var(--av-size);height:var(--av-size);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.hi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hi-row1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hi-name{font-size:12px;color:#e7f3f0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.hi-badge{font-size:10px;padding:1px 6px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.hi-badge.go{background:#e8f8ef;color:#1f7a4d}
.hi-badge.end{background:rgba(255,255,255,.2);color:#cfe0dc}
.hi-row2{font-size:12px;color:#cfe0dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-row3{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:#9fc0ba}
.hist-empty{font-size:12px;color:#9fc0ba;text-align:center;padding:20px 8px}
/* 右侧 — 填满 .app 剩余空间 */
.main{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding:14px 22px 10px;width:100%;min-width:0}
.panel{background:var(--card);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.12);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top select{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);outline:0;cursor:pointer}
.sel-group{margin-left:auto;display:flex;gap:6px;align-items:center}
/* 顶部用户信息卡片(替代 "Web 客服窗") */
.userinfo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.userinfo .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;background:var(--brand)}
.avatar svg{width:65%;height:65%;display:block}
.hi-av svg{width:65%;height:65%;display:block}
.uimeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.uiname{font-weight:700;font-size:14px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uisub{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.uisub .dot{width:8px;height:8px;border-radius:50%;background:#38c172;box-shadow:0 0 0 3px rgba(56,193,114,.18);flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;background:#38c172;box-shadow:0 0 0 4px rgba(56,193,114,.18)}
.msgs{padding:16px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;background:#fff}
/* 消息行(user/bot) — 头像 + 名字/时间 + 气泡 */
.msgrow{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msgrow.user{flex-direction:row-reverse}
.msgrow .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.msgrow.bot .avatar{background:var(--brand)}
.msgbody{display:flex;flex-direction:column;gap:4px;max-width:78%;min-width:0}
.msgmeta{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--mut);padding:0 4px;width:100%}
.msgname{font-weight:700;color:var(--txt);font-size:12px}
.msgtime{font-size:11px;color:var(--mut)}
.msg{max-width:100%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.bot{background:#eef2f5;color:var(--txt);border-bottom-left-radius:4px}
.msg.bot.em{border:2px solid var(--warn);background:#fdf0ee}
.msg.bot.lead-msg{background:transparent;padding:0;border:0}
.cap{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5}
.cap .t{border-radius:4px;padding:1px 5px;font-weight:600}
.cap .int{background:#e8f1ff;color:#2563eb}
.cap .txt{color:#8a97a1}
.cap cite{font-style:normal;color:#8291a8}
.ok{align-self:flex-start;background:#e8f8ef;border:1px solid #b7ecd0;color:#1f7a4d;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.avail{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:#fafbfc}
.avail span{font-size:11px;color:var(--mut);align-self:center;margin-right:2px}
.b{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--txt);transition:.15s}
.b:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#fff}
.in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:0}
.in input:focus{border-color:var(--brand)}
.in button{border:0;background:var(--brand);color:#fff;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.in button:disabled{opacity:.5}
.hint{color:var(--mut);font-size:11px;text-align:center;margin-top:12px;line-height:1.6}
.ansimg img{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block;cursor:zoom-in}
.ansimg{margin:8px 0 2px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.tools .b{white-space:nowrap}
/* 移动端:折叠为顶部抽屉 */
@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(82vw,300px);z-index:30;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side[data-open="1"]{transform:translateX(0)}
  .side .b-s{display:none}
  .sideClose{display:inline-flex}
}
.sideClose{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;border:0}
#sideToggle{display:none}
@media (max-width:720px){#sideToggle{display:inline-flex}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.scrim[data-open="1"]{display:block}
.ended-banner{background:#fff8e6;border:1px solid #f5d57b;color:#8a6d00;padding:8px 14px;border-radius:10px;margin:8px 16px 0;font-size:12px;text-align:center}

/* ====== Lead Card (csapp/components.py schema) ====== */
/* 容器为独立的 msgrow bot 消息,卡片本身填充在透明气泡内 */
.lead-card{margin:0;border:1px solid #c8e6d4;background:linear-gradient(135deg,#f6fcf9 0%,#eaf6ef 100%);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:420px;box-shadow:0 2px 8px rgba(56,193,114,.08)}
.lead-card .lc-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#1f7a4d}
.lead-card .lc-head .dot{width:8px;height:8px;border-radius:50%;background:#38c172;box-shadow:0 0 0 3px rgba(56,193,114,.18)}
.lead-card .lc-title{font-size:13px;color:var(--txt);font-weight:600;line-height:1.4}
.lead-card .lc-src{font-size:10px;background:#e8f4ed;color:#1f7a4d;border-radius:4px;padding:1px 5px;font-weight:600;margin-left:auto}
.lead-card .lc-hint{font-size:13px;color:var(--txt);line-height:1.5}
.lead-card .lc-hint b{color:#1f7a4d;font-weight:700;letter-spacing:.5px}
.lead-card .lc-change{font-size:11px;color:var(--mut);font-style:italic}
.lead-card form{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.lead-card .lc-row{display:flex;flex-direction:column;gap:3px}
.lead-card label{font-size:11px;color:var(--mut);font-weight:600}
.lead-card input{font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;outline:0;background:#fff;color:var(--txt)}
.lead-card input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,102,204,.15)}
.lead-card .lc-consent{font-size:10px;color:var(--mut);line-height:1.4}
.lead-card button{font-size:13px;font-weight:600;padding:8px 0;background:var(--brand);color:#fff;border:0;border-radius:8px;cursor:pointer;transition:.15s}
.lead-card button:hover{opacity:.9}
.lead-card button:disabled{opacity:.6;cursor:wait}
.lead-card .lc-ok{background:#e8f8ef;border:1px solid #b7ecd0;color:#1f7a4d;font-size:12px;border-radius:7px;padding:6px 9px;text-align:center;font-weight:600}
@keyframes lc-fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lead-card{animation:lc-fade-in .25s ease-out}

</style>

// card schema 见 csapp/components.py (4 语言标签)
function renderLeadInputCard(c, sid){
  const wrap=document.createElement("div"); wrap.className="lead-card"; wrap.dataset.cardId=c.id||("lc-"+Date.now());
  const L=c.labels||{};
  // 多语言错误提示(给 lead_input 卡用)
  const _V={
    zh:{phone:"请输入有效的手机号",email:"请输入有效的邮箱,如 name@example.com",both:"手机号和邮箱都不对,请检查",empty:"请至少填一项",generic:"提交失败,请稍后再试"},
    en:{phone:"Please enter a valid phone number",email:"Please enter a valid email, e.g. name@example.com",both:"Both phone and email look wrong, please check",empty:"Please fill at least one field",generic:"Submit failed, please try again"},
    th:{phone:"กรุณากรอกเบอร์โทรศัพท์ที่ถูกต้อง",email:"กรุณากรอกอีเมลที่ถูกต้อง เช่น name@example.com",both:"เบอร์โทรและอีเมลไม่ถูกต้อง กรุณาตรวจสอบ",empty:"กรุณากรอกอย่างน้อย 1 ช่อง",generic:"ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่"},
    es:{phone:"Por favor, ingrese un teléfono válido",email:"Por favor, ingrese un correo válido, p. ej. name@example.com",both:"Teléfono y correo no son válidos, revíselos",empty:"Complete al menos un campo",generic:"Error al enviar, intente de nuevo"},
  };
  const _v=(_V[lang]||_V.en);
  // 前端正则:邮箱标准格式 + 手机号按市场
  const _RE_EMAIL=/^[A-Za-z0-9._%+\-]{1,64}@[A-Za-z0-9.\-]{1,253}\.[A-Za-z]{2,24}$/;
  // 手机号正则(支持本地和国际格式: + 国家码 + 本地号)
  const _LOCAL_PHONE=(market==="THA")?/^0?[689]\d{8}$/:
                     (market==="AU")?/^0?4\d{8}$/:
                     (market==="CN")?/^1[3-9]\d{9}$/:
                     /^\d{7,15}$/;
  const _RE_PHONE=new RegExp(
    "^(\\+\\d{1,3})?"+_LOCAL_PHONE.source.slice(1,-1)+"$"
  );
  // 错误显示容器(放在 submit 按钮上方)
  const _errBox=document.createElement("div");
  _errBox.className="lc-err";
  _errBox.style.display="none";
  _errBox.style.color="#c0392b";
  _errBox.style.fontSize="12px";
  _errBox.style.marginTop="4px";
  const _showErr=(msg)=>{ _errBox.textContent=msg; _errBox.style.display="block"; };
  const _clearErr=()=>{ _errBox.textContent=""; _errBox.style.display="none"; };
  // 输入时自动清除错误
  wrap.innerHTML=
    `<div class="lc-head"><span class="dot"></span>`+esc(c.title||"")+`</div>`+
    `<form autocomplete="off">`+
      `<div class="lc-row"><label>`+esc(L.phone||"Phone")+`</label>`+
        `<input name="phone" placeholder="`+esc(L.phone_ph||"")+`" inputmode="tel"></div>`+
      `<div class="lc-row"><label>`+esc(L.email||"Email")+`</label>`+
        `<input name="email" placeholder="`+esc(L.email_ph||"")+`" type="email"></div>`+
      `<div class="lc-consent">`+esc(L.consent||"")+`</div>`+
      `<button type="submit">`+esc(L.submit||"Submit")+`</button>`+
    `</form>`;
  wrap.querySelector("form").appendChild(_errBox);
  wrap.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",_clearErr));
  wrap.querySelector("form").onsubmit=async(e)=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const phone=((fd.get("phone")||"").toString().trim());
    const email=((fd.get("email")||"").toString().trim());
    if(!phone && !email){ _showErr(_v.empty); wrap.querySelector("input[name=phone]").focus(); return; }
    // 前端格式校验 — 至少一项必须通过
    const ph_ok=phone && _RE_PHONE.test(phone);
    const em_ok=email && _RE_EMAIL.test(email);
    if(!ph_ok && !em_ok){
      _showErr(phone && email ? _v.both : (phone ? _v.phone : _v.email));
      (phone ? wrap.querySelector("input[name=phone]") : wrap.querySelector("input[name=email]")).focus();
      return;
    }
    const btn=wrap.querySelector("button"); btn.disabled=true; btn.textContent="…";
    try{
      const r=await fetch("/api/v1/lead",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sessionId:sid, phone, email,
          market:(market||(currentSessionMeta&&currentSessionMeta.market)||""), lang,
                            userId: (typeof userId!=="undefined")?userId:"",
                            consentVersion:c.consentVersion||"v1", source:"lead_input_card"})});
      const d=await r.json();
      if(!d.ok){
        btn.disabled=false; btn.textContent=L.submit||"Submit";
        // 后端校验失败 → 显示字段级错误
        if(d.errorKey==="phone_format"){ _showErr(_v.phone); wrap.querySelector("input[name=phone]").focus(); }
        else if(d.errorKey==="email_format"){ _showErr(_v.email); wrap.querySelector("input[name=email]").focus(); }
        else if(d.errorKey==="both_format"){ _showErr(_v.both); wrap.querySelector("input[name=phone]").focus(); }
        else if(d.errorKey==="empty"){ _showErr(_v.empty); wrap.querySelector("input[name=phone]").focus(); }
        else { _showErr(_v.generic); }
        return;
      }
      // 找到该 input 卡所在的 msgrow 容器,移除整条消息
      const parentRow = wrap.closest(".msgrow.bot");
      if(parentRow) parentRow.remove();
      // 服务端直接返回 lead_confirm schema,以独立 bot 消息追加
      if(d.leadConfirm){
        appendLeadCardMessage(d.leadConfirm, sid);
      }
    }catch(e){ btn.disabled=false; btn.textContent=L.submit||"Submit"; _showErr(_v.generic); }
  };
  return wrap;
}
function renderLeadConfirmCard(c, sid){

  let extraLine="";

    `<div class="lc-head"><span class="dot"></span>联系人已记录 ${srcTag}</div>`+

    extraLine+
    (c.changeHint?`<div class="lc-change">`+esc(c.changeHint)+`</div>`:"");

  else if(maskedEmail) hintEl.innerHTML = hintEl.innerHTML.replace(esc(maskedEmail), `<b>${esc(maskedEmail)}</b>`);
  return wrap;
}

function fmtTime(iso){
  // 把后端的 UTC ISO 字符串按浏览器本地时区显示
  if(!iso) return "";
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,16);
    const z=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  }catch(e){ return ""; }
}

async function send(q){
  q=(q||$("inp").value).trim(); if(!q)return;
  const wasNewSession=!sessionId;          // 是否本次发送才创建新会话
  $("inp").value=""; $("send").disabled=true;
  // 清理上一次会话可能残留的 ended-banner,避免脏 UI
  clearEndedBanner();
  add("user", esc(q), new Date().toISOString());
  // 占位符:保留 wrap(头像+名字+时间),只更新 bubble 内容
  const tkWrap=add("bot", "…", new Date().toISOString());
  const tk=tkWrap.querySelector(".msg");
  let ok=false;
  try{
    const T=I18N[lang];
    const r=await fetch("/api/v1/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId,message:q,market,langHint:lang,userId})});
    const d=await r.json();
    sessionId=d.sessionId;
    if(d.ended){ sessionId=null; }
    // 跟踪当前会话 meta(市场/语言)→ 顶部副标题随当前会话更新
    currentSessionMeta={market:d.market||null, language:d.language||null};
    renderUserInfo();
    const em=(d.intent==="emergency");
    tk.className="msg bot"+(em?" em":"");
    let html=esc(d.reply||"");
    if(d.answer_images&&d.answer_images.length){
      html+='<div class="ansimg">'+d.answer_images.map(u=>'<img src="'+esc(u)+'" loading="lazy" onclick="window.open(this.src)" alt="">').join('')+'</div>';
    }
    let cap=[];
    if(d.intent)cap.push('<span class="t int">'+esc(d.intent)+'</span>');
    if(d.market)cap.push('<span class="t txt">'+esc(d.market)+' / '+esc(d.language||'')+'</span>');
    if(em)cap.push('<span class="t" style="background:#c0392b;color:#fff">'+T.emergency+'</span>');
    if(d.escalate)cap.push('<span class="t" style="background:#8e44ad;color:#fff">'+T.escalate+'</span>');
    if(d.citations&&d.citations.length){
      const seen=new Set(); const cites=[];
      d.citations.forEach(c=>{
        const doc=c.doc||c.concept||""; const pg=c.page?(" P"+c.page):"";
        const key=doc+pg;
        if(seen.has(key))return; seen.add(key);
        if(cites.length>=3)return;
        cites.push('<cite>'+esc(doc)+pg+'</cite>');
      });
      if(cites.length)cap.push(T.cite+cites.join(', '));
    }
    if(cap.length)html+='<div class="cap">'+cap.join(' &nbsp; ')+'</div>';
    tk.innerHTML=html;
    // ----- Lead Card 作为独立消息(头像+时间+气泡,同其他 bot 消息格式) -----
    if(Array.isArray(d.components)&&d.components.length){
      d.components.forEach(c=>{ if(c) appendLeadCardMessage(c, sessionId); });
    }
    // 刷新时间(用本地时间,与 meta 里的一致)
    const tEl=tkWrap.querySelector(".msgtime");
    if(tEl) tEl.textContent=fmtTime(new Date().toISOString());
    ok=true;
  }catch(e){ tk.textContent=I18N[lang].fail+(e.message||e); }
  // 注:不在每次 bot 回复后刷新左侧会话列表 — 会导致列表闪烁/滚动条跳变。
  // 但如果是本次发送才创建的新会话,需要刷新一次,否则左侧列表不会出现它。
  if(wasNewSession){ loadHistory(); }
  $("send").disabled=false;
}
function esc(s){s=String(s);return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
// ---- 历史侧栏 / 新会话 / 关闭 ----
function groupKey(iso){
  const d=new Date(iso), now=new Date(); if(isNaN(d)) return "earlier";
  const day=86400000, diff=now-d;
  if(diff<day) return "today"; if(diff<2*day) return "yesterday";
  if(diff<7*day) return "lastWeek"; return "earlier";
}
function makeItem(s){
  const item=document.createElement("div"); item.className="hist-item"+(s.ended?" ended":"");
  const av=avatarFor(s.userId||s.sessionId||"x", "list");
  const name=visitorName(s.userId||"");
  const badge=s.ended?`<span class="hi-badge end">${I18N[lang].ended}</span>`:`<span class="hi-badge go">${I18N[lang].ongoing}</span>`;
  // 摘要:优先 lastMessage(最近一条),fallback 到 title
  const last=(s.lastMessage||"").trim();
  const show=last?esc(last):esc(s.title||s.intent||"");
  item.innerHTML=
    `<div class="hi-av" style="background:${av.color}">${av.svg}</div>`+
    `<div class="hi-body">`+
      `<div class="hi-row1"><span class="hi-name">${esc(name)}</span>${badge}</div>`+
      `<div class="hi-row2">${show}</div>`+
      `<div class="hi-row3"><span>${esc(s.market||"")}${s.intent?(" · "+esc(s.intent)):""}</span><span>${esc(fmtTime(s.updatedAt))}</span></div>`+
    `</div>`;
  // 已结束会话也允许点击 → 加载历史查看(只是不能再发消息)
  item.onclick=()=>resumeSession(s.sessionId);
  return item;
}
async function loadHistory(){
  const list=$("histList"); list.innerHTML="<div class='hist-empty'>…</div>";
  try{
    const r=await fetch("/api/v1/sessions?userId="+encodeURIComponent(userId||""));
    const d=await r.json(); const ss=d.sessions||[]; list.innerHTML="";
    if(!ss.length){ list.innerHTML="<div class='hist-empty'>"+I18N[lang].noHistory+"</div>"; return; }
    const groups={today:[],yesterday:[],lastWeek:[],earlier:[]};
    ss.forEach(s=>{ groups[groupKey(s.updatedAt)].push(s); });
    ["today","yesterday","lastWeek","earlier"].forEach(k=>{
      const arr=groups[k]; if(!arr.length)return;
      const h=document.createElement("div"); h.className="hg"; h.textContent=I18N[lang][k]; list.appendChild(h);
      arr.forEach(s=>list.appendChild(makeItem(s)));
    });
  }catch(e){ list.innerHTML="<div class='hist-empty'>"+I18N[lang].fail+(e.message||e)+"</div>"; }
}
async function resumeSession(id){
  try{
    // 关键:每次进入会话前先清掉旧 banner,防止多次点击累积 / 新会话残留
    clearEndedBanner();
    const r=await fetch("/api/v1/session?sessionId="+encodeURIComponent(id));
    const d=await r.json(); if(!d.success)return;
    const s=d.session; sessionId=s.sessionId;
    // 跟踪当前会话 meta → 顶部副标题更新
    currentSessionMeta={market:s.market||null, language:s.language||null};
    renderUserInfo();
    const ms=$("msgs"); ms.innerHTML=""; let n=0;
    // 按 history 顺序忠实回放,不去重。后端留资提交时已把 lead_input 替换为 lead_confirm,
    // 不会出现 input + confirm 同时存在的情况。
    (s.history||[]).forEach(t=>{
      if(t.user){ add("user", esc(t.user), t.t||""); n++; }
      if(t.bot){ add("bot", esc(t.bot), t.t||""); n++; }
      if(Array.isArray(t.components)){
        t.components.forEach(c=>{ if(c){ appendLeadCardMessage(c, s.sessionId); n++; } });
      }
    });
    if(!n) add("bot", I18N[lang].greet, new Date().toISOString());
    // 已结束会话:加横幅提示 + 禁用 Send/Input(允许查看,禁止继续)
    if(s.ended){
      const banner=document.createElement("div");
      banner.className="ended-banner";
      banner.textContent=I18N[lang].endedTip;
      ms.parentNode.insertBefore(banner, ms.nextSibling);
      $("inp").disabled=true; $("send").disabled=true;
      $("closeBtn").style.display="none";   // 已结束无需再 ×
    }else{
      $("inp").disabled=false; $("send").disabled=false;
      $("closeBtn").style.display="";
    }
    closeSide();
  }catch(e){}
}
// 工具:清掉所有 ended-banner(panel 里最多一个,但用 querySelectorAll 防止累积)
function clearEndedBanner(){
  document.querySelectorAll(".ended-banner").forEach(el=>el.remove());
}
function newSession(clearMsg){
  sessionId=null;
  clearEndedBanner();   // 关键:新会话也要清 banner,否则上一个 ended 会话的提示会残留
  $("inp").disabled=false; $("send").disabled=false;
  // 顶部副标题回到全局默认(无当前会话)
  currentSessionMeta=null;
  renderUserInfo();
  $("closeBtn").style.display="";
  if(clearMsg){ $("msgs").innerHTML=""; add("bot",I18N[lang].greet); }
  loadHistory();
}
async function closeSession(){
  if(sessionId){ try{ await fetch("/api/v1/session/end",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId,reason:"user_closed"})}); }catch(e){} }
  newSession(true);
}
// 侧栏(移动端)开关
function openSide(){ $("side").dataset.open="1"; $("scrim").dataset.open="1"; }
function closeSide(){ $("side").dataset.open=""; $("scrim").dataset.open=""; }
$("sideToggle").onclick=openSide;
$("sideClose").onclick=closeSide;
$("scrim").onclick=closeSide;
$("newBtn").onclick=()=>{ newSession(true); closeSide(); };
$("closeBtn").onclick=closeSession;
$("send").onclick=()=>send();
$("inp").addEventListener("keydown",e=>{
  if(e.isComposing || e.keyCode===229)return;
  if(e.key==="Enter")send();
});
setLang(detectDefaultLang());
add("bot", I18N[lang].greet, new Date().toISOString());
loadHistory();
</script>
</body>
